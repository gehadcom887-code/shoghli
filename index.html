<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شغلي - CV احترافي</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:#f5f7fa;margin:0;padding:15px}
header{text-align:center;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;padding:25px;border-radius:15px}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:800px){.builder{grid-template-columns:1fr}}
.form{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.08)}
.form input,.form textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px}
.previewBtn{background:#dfe6e9}
.download{background:#00b894;color:white}
.cv{background:white;padding:25px;border-radius:12px;min-height:500px;position:relative}
#watermark{position:absolute;bottom:40%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:32px;color:rgba(0,0,0,0.08)}
#pay-section{display:none;margin-top:15px}
.pay-box{background:#fff8e1;border:2px dashed #fdcb6e;padding:20px;border-radius:12px;text-align:center}
.price{font-size:26px;font-weight:bold;color:#e17055}
.num{background:#2d3436;color:white;padding:10px;border-radius:8px;font-size:20px;margin:10px 0;letter-spacing:2px}
</style>
</head>
<body>
<header>
<h1>شغلي - صانع السيرة الذاتية</h1>
<p>اعملي CV احترافي في 5 دقايق</p>
</header>

<div class="builder">
<div class="form">
<h3>بياناتك</h3>
<input id="name" placeholder="الاسم الكامل">
<input id="title" placeholder="المسمى الوظيفي">
<input id="phone" placeholder="الموبايل">
<textarea id="about" placeholder="نبذة عنك"></textarea>
<textarea id="skills" placeholder="المهارات"></textarea>
<textarea id="exp" placeholder="الخبرات"></textarea>

<button class="previewBtn" onclick="updatePreview()">معاينة</button>
<button class="download" onclick="handleDownload()">تحميل PDF مجاني</button>

<div id="pay-section">
<div class="pay-box">
<h3>🔒 عايزة النسخة الاحترافية؟</h3>
<p>النسخة المجانية فيها علامة مائية</p>
<div class="price">30 جنيه فقط</div>
<p>حولي على فودافون كاش:</p>
<div class="num">01013724578</div>
<p style="font-size:12px;color:#636e72">بعد التحويل ابعتي سكرين شوت على نفس الرقم وهنبعتلك كود التفعيل</p>
<button onclick="alert('بعد ما تحولي على 01013724578 ابعتي رسالة بالاسم وهنفعل التحميل الاحترافي ليكي')" style="background:#e84393;color:white">لقد حولت - اطلب التفعيل</button>
</div>
</div>
</div>

<div class="cv" id="cvPreview">
<h2 id="p-name">الاسم</h2>
<h4 id="p-title">المسمى الوظيفي</h4>
<p id="p-about"></p>
<p id="p-skills"></p>
<p id="p-exp"></p>
<div id="watermark">Shoghli - مجاني</div>
</div>
</div>

<script>
function updatePreview(){
document.getElementById('p-name').innerText=document.getElementById('name').value||'الاسم';
document.getElementById('p-title').innerText=document.getElementById('title').value||'المسمى الوظيفي';
document.getElementById('p-about').innerText=document.getElementById('about').value;
document.getElementById('p-skills').innerText=document.getElementById('skills').value;
document.getElementById('p-exp').innerText=document.getElementById('exp').value;
}
function handleDownload(){
updatePreview();
// هنا بيظهر قسم الدفع بس لما يدوس تحميل
document.getElementById('pay-section').style.display='block';
document.getElementById('pay-section').scrollIntoView({behavior:'smooth'});
alert('تم تحميل النسخة المجانية - لو عايزة بدون علامة مائية حولي على 01013724578');
}
</script>
</body>
</html>
