<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRA - سِيرة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f4f5f7}
.header{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.lang-btn{background:#fff;color:#111;border:none;padding:8px 16px;border-radius:20px;font-weight:800;cursor:pointer}
.container{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:380px 1fr;gap:20px;padding:0 15px}
.form-box,.preview-box{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 20px #0001}
.form-box input,.form-box textarea{width:100%;padding:11px;margin-bottom:8px;border:1px solid #ddd;border-radius:10px;font-family:inherit;font-size:13px}
.small-label{font-size:11px;font-weight:800;color:#555;margin-bottom:3px;display:block;text-align:right}
.btn-main{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer}
#cvPreview{padding:32px;border:1px solid #eee;min-height:620px;background:#fff;color:#222}
.cv-top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:15px;margin-bottom:15px}
#cvImg{width:85px;height:85px;border-radius:50%;object-fit:cover;display:none;border:2px solid #111}
.cv-head{font-weight:800;font-size:12px;margin-bottom:5px}
.cv-text{font-size:12.5px;white-space:pre-wrap;line-height:1.7}
.layout{display:grid;grid-template-columns:110px 1fr;gap:15px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:999;padding:15px}
.modal.show{display:flex}
.modal-box{background:#fff;padding:26px;border-radius:22px;max-width:410px;width:100%;text-align:center}
.vf-box{background:#fff5f6;border:1.8px dashed #e11d48;border-radius:14px;padding:14px;margin:14px 0}
.input-secure{width:100%;padding:12px;margin-bottom:8px;border:1.5px solid #ddd;border-radius:10px;text-align:center;font-weight:700}
.input-secure.error{border-color:#e11d48;background:#fff5f5}
.err{color:#e11d48;font-size:11px;display:none;text-align:right;margin:-4px 0 8px}
.btn-gold{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.btn-gold:disabled{background:#ccc}
@media print{.header,.form-box,.modal{display:none!important}.container{display:block}.preview-box{box-shadow:none}}
@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><b id="logo">SIRA - سِيرة ✨</b><button class="lang-btn" id="langBtn" onclick="toggleLang()">English 🇺🇸</button></div>
<div class="container">
<div class="form-box">
<h3 id="fTitle">📝 بياناتك</h3>
<input type="file" accept="image/*" onchange="loadImg(event)">
<span class="small-label" id="lblAr">الاسم بالعربي *</span>
<input id="iNameAr" placeholder="مثال: جهاد محمد" oninput="u()">
<span class="small-label" id="lblEn">الاسم بالانجليزي *</span>
<input id="iNameEn" placeholder="Example: Gehad Mohamed" oninput="u()">
<input id="iJob" placeholder="المسمى الوظيفي" oninput="u()">
<input id="iPhone" placeholder="رقم الهاتف" oninput="u()">
<input id="iEmail" placeholder="البريد" oninput="u()">
<input id="iAddress" placeholder="العنوان" oninput="u()">
<textarea id="iAbout" rows="3" placeholder="نبذة عنك" oninput="u()"></textarea>
<textarea id="iExp" rows="4" placeholder="الخبرات" oninput="u()"></textarea>
<textarea id="iEdu" rows="3" placeholder="المؤهل" oninput="u()"></textarea>
<textarea id="iCourses" rows="3" placeholder="الكورسات" oninput="u()"></textarea>
<button class="btn-main" id="btnDown" onclick="openPay()">⬇️ تحميل - 100 جنيه</button>
</div>
<div class="preview-box"><div id="cvPreview"><div class="cv-top"><div><h1 id="cName"></h1><div id="cJob" style="color:#666"></div><div class="layout"><div style="border-left:1px solid #eee;padding-left:10px"><div id="cContact" style="font-size:11px;line-height:2.1"></div></div><div><div class="cv-head" id="lAbout">النبذة</div><div id="cAbout" class="cv-text"></div></div></div></div><img id="cvImg"></div><div style="margin-top:15px"><div class="cv-head" id="lExp">الخبرات</div><div id="cExp" class="cv-text"></div></div><div style="margin-top:15px"><div class="cv-head" id="lEdu">التعليم</div><div id="cEdu" class="cv-text"></div></div><div style="margin-top:15px"><div class="cv-head" id="lCourses">الكورسات</div><div id="cCourses" class="cv-text"></div></div></div></div>
</div>
<div id="payModal" class="modal">
<div class="modal-box">
<h2 id="payTitle">تأكيد الدفع</h2>
<div class="vf-box"><div style="font-weight:900;color:#e11d48">Vodafone Cash</div><div style="font-size:22px;font-weight:900">01013724578</div><div style="font-size:11px;color:#666" id="priceTxt">100 جنيه - تفعيل فوري</div></div>
<div style="text-align:right">
<label style="font-size:11px;font-weight:700" id="lblTrx">رقم العملية *</label>
<input id="trxId" class="input-secure" placeholder="من رسالة فودافون" oninput="check()"><div class="err" id="e1">لازم رقم العملية</div>
<label style="font-size:11px;font-weight:700" id="lblPhone">رقمك *</label>
<input id="sPhone" class="input-secure" placeholder="01xxxxxxxxx" oninput="check()"><div class="err" id="e2">لازم رقمك</div>
<label style="font-size:11px;font-weight:700" id="lblName">اسمك *</label>
<input id="sName" class="input-secure" placeholder="اسمك" oninput="check()"><div class="err" id="e3">لازم اسمك</div>
</div>
<button class="btn-gold" id="btnGo" onclick="done()" disabled>تأكيد وتحميل 💳</button>
<button onclick="closePay()" style="margin-top:8px;background:none;border:none;color:#999;cursor:pointer">رجوع</button>
</div>
</div>
<script>
let isAr=true;
function toggleLang(){
isAr=!isAr;
document.documentElement.dir=isAr?'rtl':'ltr';
document.getElementById('logo').innerText=isAr?'SIRA - سِيرة ✨':'SIRA ✨';
document.getElementById('langBtn').innerText=isAr?'English 🇺🇸':'عربي 🇪🇬';
document.getElementById('fTitle').innerText=isAr?'📝 بياناتك':'📝 Your Info';
document.getElementById('lblAr').innerText=isAr?'الاسم بالعربي *':'Arabic Name *';
document.getElementById('lblEn').innerText=isAr?'الاسم بالانجليزي *':'English Name *';
document.getElementById('lAbout').innerText=isAr?'النبذة':'Summary';
document.getElementById('lExp').innerText=isAr?'الخبرات':'Experience';
document.getElementById('lEdu').innerText=isAr?'التعليم':'Education';
document.getElementById('lCourses').innerText=isAr?'الكورسات':'Courses';
document.getElementById('btnDown').innerText=isAr?'⬇️ تحميل - 100 جنيه':'⬇️ Download - 100 EGP';
u();
}
function loadImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{cvImg.src=x.target.result;cvImg.style.display='block';};r.readAsDataURL(f);}
function u(){
// السر هنا: الاسم بيتغير حسب اللغة
let displayName = '';
if(isAr){ displayName = iNameAr.value || iNameEn.value; } else { displayName = iNameEn.value || iNameAr.value; }
cName.innerText=displayName;
cJob.innerText=iJob.value;
let h=''; if(iPhone.value)h+=`📞 ${iPhone.value}<br>`; if(iEmail.value)h+=`✉️ ${iEmail.value}<br>`; if(iAddress.value)h+=`📍 ${iAddress.value}`;
cContact.innerHTML=h; cAbout.innerText=iAbout.value; cExp.innerText=iExp.value; cEdu.innerText=iEdu.value; cCourses.innerText=iCourses.value;
}
function openPay(){payModal.classList.add('show')}function closePay(){payModal.classList.remove('show')}
function check(){let ok=true;if(!trxId.value.trim()){trxId.classList.add('error');e1.style.display='block';ok=false}else{trxId.classList.remove('error');e1.style.display='none'}if(!sPhone.value.trim()){sPhone.classList.add('error');e2.style.display='block';ok=false}else{sPhone.classList.remove('error');e2.style.display='none'}if(!sName.value.trim()){sName.classList.add('error');e3.style.display='block';ok=false}else{sName.classList.remove('error');e3.style.display='none'}btnGo.disabled=!ok;return ok;}
function done(){if(!check())return;const trx=encodeURIComponent(trxId.value.trim()),phone=encodeURIComponent(sPhone.value.trim()),name=encodeURIComponent(sName.value.trim());const msg=`مرحبا جهاد، حولت 100 جنيه فودافون كاش%0Aالاسم: ${name}%0Aرقمي: ${phone}%0Aرقم العملية: ${trx}`;window.open(`https://wa.me/201013724578?text=${msg}`,'_blank');closePay();setTimeout(()=>window.print(),800);}
u();
</script>
</body>
</html>
