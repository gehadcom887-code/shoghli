<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRA - سِيرة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:#f1f3f4}
.header{background:white;padding:15px;text-align:center;box-shadow:0 1px 3px #ddd;position:sticky;top:0;z-index:10}
.container{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 15px}
@media(max-width:800px){.container{grid-template-columns:1fr}}
.form-box,.preview-box{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #ddd}
h3{margin-bottom:15px;color:#333}
input,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;font-family:inherit}
textarea{resize:vertical}
.btn{width:100%;padding:12px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px}
/* شكل السيرة الجديد عمودين */
#cvPreview{background:white;border:1px solid #eee;border-radius:8px;overflow:hidden;min-height:400px}
.cv-header{background:#1a2a4a;color:white;padding:20px;text-align:center}
.cv-header h2{font-size:22px;margin-bottom:5px}
.cv-body{display:grid;grid-template-columns:180px 1fr;min-height:350px}
.cv-side{background:#f8f9fa;padding:15px;border-left:1px solid #eee}
.cv-main{padding:15px}
.cv-section{margin-bottom:18px}
.cv-section-title{font-weight:bold;color:#1a2a4a;border-bottom:2px solid #1a73e8;padding-bottom:4px;margin-bottom:8px;font-size:13px}
.cv-contact div{font-size:11px;margin-bottom:6px;word-break:break-all;line-height:1.6}
.small{font-size:12px;color:#555;line-height:1.7;white-space:pre-wrap}
</style>
</head>
<body>
<div class="header"><b>سِيرة - SIRA</b> | منشئ السيرة الذاتية</div>
<div class="container">
<div class="form-box">
<h3>بياناتك</h3>
<input id="iName" placeholder="الاسم الكامل - سيظهر كبير فوق" oninput="updateCV()">
<input id="iPhone" placeholder="رقم التليفون" oninput="updateCV()">
<input id="iEmail" placeholder="الايميل" oninput="updateCV()">
<textarea id="iAbout" rows="3" placeholder="النبذة التعريفية" oninput="updateCV()"></textarea>
<textarea id="iExp" rows="4" placeholder="الخبرات - كل خبرة في سطر" oninput="updateCV()"></textarea>
<textarea id="iEdu" rows="3" placeholder="التعليم" oninput="updateCV()"></textarea>
<textarea id="iCourses" rows="3" placeholder="الكورسات" oninput="updateCV()"></textarea>
<button class="btn" onclick="window.print()">تحميل PDF</button>
</div>
<div class="preview-box">
<div style="text-align:center;margin-bottom:10px;color:#666;font-size:13px">معاينة مباشرة - عمودين</div>
<div id="cvPreview">
  <div class="cv-header">
    <h2 id="cvName">اسمك هنا</h2>
    <div style="font-size:12px;opacity:0.9">المسمى الوظيفي</div>
  </div>
  <div class="cv-body">
    <div class="cv-side">
      <div class="cv-section">
        <div class="cv-section-title">تواصل</div>
        <div id="cvContact" class="cv-contact">بيانات التواصل</div>
      </div>
      <div class="cv-section">
        <div class="cv-section-title">مهارات</div>
        <div class="small">تضاف تلقائيا</div>
      </div>
    </div>
    <div class="cv-main">
      <div class="cv-section">
        <div class="cv-section-title">النبذة</div>
        <div id="cvAbout" class="small">النبذة ستظهر هنا</div>
      </div>
      <div class="cv-section">
        <div class="cv-section-title">الخبرات</div>
        <div id="cvExp" class="small">الخبرات</div>
      </div>
      <div class="cv-section">
        <div class="cv-section-title">التعليم</div>
        <div id="cvEdu" class="small">التعليم</div>
      </div>
      <div class="cv-section">
        <div class="cv-section-title">الكورسات</div>
        <div id="cvCourses" class="small">الكورسات</div>
      </div>
    </div>
  </div>
</div>
</div>
</div>
</div>
<script>
function updateCV(){
 document.getElementById('cvName').innerText=document.getElementById('iName').value||'اسمك هنا';
 let html='';
 if(document.getElementById('iPhone').value) html+=`<div>📞 ${document.getElementById('iPhone').value}</div>`;
 if(document.getElementById('iEmail').value) html+=`<div>✉️ ${document.getElementById('iEmail').value}</div>`;
 document.getElementById('cvContact').innerHTML=html||'بيانات التواصل';
 document.getElementById('cvAbout').innerText=document.getElementById('iAbout').value||'النبذة ستظهر هنا';
 document.getElementById('cvExp').innerText=document.getElementById('iExp').value||'الخبرات';
 document.getElementById('cvEdu').innerText=document.getElementById('iEdu').value||'التعليم';
 document.getElementById('cvCourses').innerText=document.getElementById('iCourses').value||'الكورسات';
}
</script>
</body>
</html>
