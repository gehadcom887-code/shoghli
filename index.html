<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRA PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f8f9fb}
.header{background:white;padding:14px 20px;display:flex;justify-content:space-between;box-shadow:0 1px 10px #0001;position:sticky;top:0;z-index:10}
.container{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:380px 1fr;gap:20px;padding:0 15px}
.form-box,.preview-box{background:white;border-radius:16px;padding:22px;box-shadow:0 2px 12px #0001}
input,textarea{width:100%;padding:12px;margin-bottom:10px;border:1px solid #e0e0e0;border-radius:10px;font-family:inherit}
.btn{width:100%;padding:14px;background:#111;color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.btn-gold{width:100%;padding:15px;background:linear-gradient(135deg,#1a73e8,#0d47a1);color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px}
#cvPreview{background:white;padding:35px;border:1px solid #eee;color:#222;min-height:500px}
.cv-top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:15px;margin-bottom:20px}
#cvImg{width:85px;height:85px;border-radius:50%;object-fit:cover;display:none;border:2px solid #111}
.cv-head{font-size:13px;font-weight:700;margin-bottom:8px;color:#111}
.cv-text{font-size:12.5px;white-space:pre-wrap}
.layout{display:grid;grid-template-columns:130px 1fr;gap:20px}
.modal{display:none;position:fixed;inset:0;background:#0006;backdrop-filter:blur(6px);z-index:100;justify-content:center;align-items:center;padding:15px}
.modal-box{background:white;padding:28px;border-radius:20px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 40px #0002}
.badge{display:inline-block;background:#eef4ff;color:#1a73e8;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}
.vf-box{background:#f9fafb;border:1.5px dashed #e11d48;border-radius:12px;padding:16px;margin:16px 0}
@media print{.header,.form-box,.modal{display:none!important}.container{display:block;margin:0;padding:0}.preview-box{box-shadow:none;border:none;padding:0}#cvPreview{border:none}}
@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><b>SIRA PRO</b><span style="font-size:12px;color:#666">CV Maker</span></div>
<div class="container">
<div class="form-box">
<h3 style="margin-bottom:12px">بياناتك</h3>
<input type="file" accept="image/*" onchange="loadImg(event)">
<input id="iName" placeholder="الاسم" oninput="u()">
<input id="iJob" placeholder="المسمى الوظيفي" oninput="u()">
<input id="iPhone" placeholder="الهاتف" oninput="u()">
<input id="iEmail" placeholder="البريد" oninput="u()">
<input id="iAddress" placeholder="العنوان" oninput="u()">
<textarea id="iAbout" rows="2" placeholder="النبذة" oninput="u()"></textarea>
<textarea id="iExp" rows="4" placeholder="الخبرات" oninput="u()"></textarea>
<textarea id="iEdu" rows="2" placeholder="التعليم" oninput="u()"></textarea>
<textarea id="iCourses" rows="2" placeholder="الكورسات" oninput="u()"></textarea>
<button class="btn-gold" onclick="openPay()">✨ تحميل النسخة الاحترافية</button>
</div>
<div class="preview-box"><div id="cvPreview">
<div class="cv-top"><div><h1 id="cName" style="font-size:26px">جهاد محمد</h1><div id="cJob" style="color:#666">تجارة</div><div class="layout" style="margin-top:12px"><div style="border-left:1px solid #eee;padding-left:15px"><div id="cContact" style="font-size:11px;line-height:2"></div></div><div><div class="cv-head">النبذة</div><div id="cAbout" class="cv-text"></div></div></div></div><img id="cvImg"></div>
<div style="margin-top:20px"><div class="cv-head">الخبرات</div><div id="cExp" class="cv-text"></div></div>
<div style="margin-top:18px"><div class="cv-head">التعليم</div><div id="cEdu" class="cv-text"></div></div>
<div style="margin-top:18px"><div class="cv-head">الكورسات</div><div id="cCourses" class="cv-text"></div></div>
</div></div>
</div>

<div id="payModal" class="modal">
<div class="modal-box">
<div class="badge">✨ سيرتك جاهزة</div>
<h2 style="font-size:20px;margin-bottom:6px">فتح التحميل بجودة عالية</h2>
<p style="color:#666;font-size:13px;line-height:1.6">سيرتك الاحترافية جاهزة للتحميل بصيغة PDF عالية الجودة، جاهزة للطباعة والإرسال</p>
<div class="vf-box">
<div style="font-size:12px;color:#666">الدفع الآمن عبر</div>
<div style="font-weight:800;color:#e11d48;font-size:18px;margin:4px 0">Vodafone Cash</div>
<div style="font-size:22px;font-weight:800;letter-spacing:1px">01013724578</div>
<div style="font-size:11px;color:#666;margin-top:6px">رسوم الخدمة: 100 جنيه • تفعيل فوري</div>
</div>
<button class="btn-gold" onclick="window.open('https://wa.me/201013724578?text=مرحبا، عايزة افتح التحميل بجودة عالية - حولت 100 جنيه فودافون كاش','_blank')">تأكيد التحويل عبر واتساب 💬</button>
<button class="btn" onclick="confirmPay()" style="margin-top:10px;background:#f5f5f5;color:#111;border:1px solid #ddd">تم التحويل - فتح التحميل الآن</button>
<button onclick="closePay()" style="margin-top:12px;background:none;border:none;color:#999;cursor:pointer;font-size:13px">رجوع</button>
</div>
</div>

<script>
function openPay(){document.getElementById('payModal').style.display='flex'}
function closePay(){document.getElementById('payModal').style.display='none'}
function confirmPay(){closePay(); window.print()}
function loadImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{cvImg.src=x.target.result;cvImg.style.display='block';};r.readAsDataURL(f);}
function u(){cName.innerText=iName.value||'جهاد محمد'; cJob.innerText=iJob.value; let h=''; if(iPhone.value) h+=`<div>📞 ${iPhone.value}</div>`; if(iEmail.value) h+=`<div>✉️ ${iEmail.value}</div>`; if(iAddress.value) h+=`<div>📍 ${iAddress.value}</div>`; cContact.innerHTML=h; cAbout.innerText=iAbout.value; cExp.innerText=iExp.value; cEdu.innerText=iEdu.value; cCourses.innerText=iCourses.value;}
u();
</script>
</body>
</html>
