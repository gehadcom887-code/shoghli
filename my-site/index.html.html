    <style>
        * {
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #eef2ff;
            padding: 20px
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 5px
        }

        h1+p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 13px
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            margin: auto;
            flex-wrap: wrap
        }

        .form-box,
        .preview-box {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            flex: 1;
            min-width: 320px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .06)
        }

        label {
            font-weight: 700;
            display: block;
            margin-top: 10px;
            margin-bottom: 3px;
            font-size: 13px
        }

        input,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 13px
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            margin-top: 8px;
            cursor: pointer;
            font-size: 13px
        }

        .main {
            background: #4f46e5;
            color: #fff
        }

        .gold {
            background: linear-gradient(135deg, #f59e0b, #fbbf24)
        }

        .vip {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99
        }

        .modal.active {
            display: flex
        }

        .modal-box {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            max-width: 380px;
            width: 90%;
            text-align: center
        }

        .preview-item {
            margin: 6px 0;
            font-size: 13px
        }

        .cash {
            font-size: 22px;
            font-weight: 800;
            color: #4f46e5

    <script>
        const MY_CASH_NUMBER = "01013724578";

<body>
    <h1>شغلي - صانع السيرة الذاتية</h1>
    <p>اعملي سي في احترافي في 5 دقايق وحمليه PDF</p>
    <div class="container">
        <div class="form-box">
            <label>الاسم الكامل</label><input id="name" oninput="updateCV()">
            <label>المسمى الوظيفي</label><input id="job" oninput="updateCV()">
            <label>البريد</label><input id="email" oninput="updateCV()">
            <label>رقم التليفون</label><input id="phone" oninput="updateCV()">
            <label>الجنسية</label><input id="nation" oninput="updateCV()">
            <label>العنوان</label><input id="address" oninput="updateCV()">
            <label>نبذة</label><textarea id="about" oninput="updateCV()"></textarea>
            <label>الخبرات</label><textarea id="exp" oninput="updateCV()"></textarea>
            <label>التعليم</label><input id="edu" oninput="updateCV()">
            <label>الكورسات 📜</label><textarea id="courses" oninput="updateCV()"></textarea>
            <label>المهارات</label><input id="skills" oninput="updateCV()">
            <button class="main" onclick="window.print()">👁️ معاينة مجانية</button>
            <button class="gold" onclick="openPay(50)">⬇️ تحميل عادي - 50ج</button>
            <button class="vip" onclick="openPay(100)">👑 تحميل VIP - 100ج</button>
        </div>
        <div class="preview-box">
            <h2 id="p-name" style="color:#4f46e5;border-bottom:2px solid #e0e7ff;padding-bottom:6px">اسمك هنا</h2>
            <div id="p-job" style="color:#6b7280;font-weight:700;margin:8px 0"></div>
            <div class="preview-item">📧 <span id="p-email">-</span> | 📱 <span id="p-phone">-</span></div>
            <div class="preview-item">🌍 <span id="p-nation">-</span> | 📍 <span id="p-address">-</span></div>
            <hr style="margin:10px 0;border-top:1px solid #eee">
            <div class="preview-item"><b>نبذة:</b> <span id="p-about">-</span></div>
            <div class="preview-item"><b>الخبرات:</b> <span id="p-exp">-</span></div>
            <div class="preview-item"><b>التعليم:</b> <span id="p-edu">-</span></div>
            <div class="preview-item" style="background:#fef9c3;padding:8px;border-radius:8px"><b>📜 الكورسات:</b> <span
                    id="p-courses">-</span></div>
            <div class="preview-item"><b>المهارات:</b> <span id="p-skills">-</span></div>
        </div>
    </div>
    <div class="modal" id="payModal">
        <div class="modal-box">
            <h2>الدفع</h2>
            <p>حولي <span id="mAmount">50</span>ج على</p>
            <p class="cash">01013724578</p><a id="mWA" href="#" target="_blank"
                style="display:block;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;margin-top:10px">واتساب
                ✅</a><button class="main" onclick="window.print();closePay()">حولت؟ حملي</button>
            <div onclick="closePay()" style="margin-top:8px;color:#999;cursor:pointer">اغلاق</div>
        </div>
    </div>
    <script>
        function updateCV() { document.getElementById('p-name').innerText = document.getElementById('name').value || 'اسمك هنا'; document.getElementById('p-job').innerText = document.getElementById('job').value; document.getElementById('p-email').innerText = document.getElementById('email').value || '-'; document.getElementById('p-phone').innerText = document.getElementById('phone').value || '-'; document.getElementById('p-nation').innerText = document.getElementById('nation').value || '-'; document.getElementById('p-address').innerText = document.getElementById('address').value || '-'; document.getElementById('p-about').innerText = document.getElementById('about').value || '-'; document.getElementById('p-exp').innerText = document.getElementById('exp').value || '-'; document.getElementById('p-edu').innerText = document.getElementById('edu').value || '-'; document.getElementById('p-courses').innerText = document.getElementById('courses').value || '-'; document.getElementById('p-skills').innerText = document.getElementById('skills').value || '-'; }
        function openPay(p) { document.getElementById('mAmount').innerText = p; document.getElementById('mWA').href = "https://wa.me/201013724578?text=حولت " + p + "ج"; document.getElementById('payModal').classList.add('active'); }
        function closePay() { document.getElementById('payModal').classList.remove('active') }
    </script>
